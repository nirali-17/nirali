
<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Prediction System</title>
</head>
<body>

    <h1>Student Performance Prediction System</h1>

    <form onsubmit="predict(event)">
        <label>Student Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label>Maths Marks:</label>
        <input type="number" id="maths" min="0" max="100" required>
        <br><br>

        <label>Science Marks:</label>
        <input type="number" id="science" min="0" max="100" required>
        <br><br>

        <label>English Marks:</label>
        <input type="number" id="english" min="0" max="100" required>
        <br><br>

        <button type="submit">Predict Performance</button>
    </form>

    <h2 id="result"></h2>

    <script>
        function predict(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let maths = Number(document.getElementById("maths").value);
            let science = Number(document.getElementById("science").value);
            let english = Number(document.getElementById("english").value);

            let average = (maths + science + english) / 3;
            let performance;

            if (average >= 80) {
                performance = "Excellent";
            } else if (average >= 60) {
                performance = "Good";
            } else if (average >= 40) {
                performance = "Average";
            } else {
                performance = "Needs Improvement";
            }

            document.getElementById("result").innerHTML =
                "Student Name: " + name + "<br>" +
                "Average Marks: " + average.toFixed(2) + "<br>" +
                "Predicted Performance: " + performance;
        }
    </script>

</body>
</html>
